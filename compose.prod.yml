# Deployed stack. Run on the server with:
#   docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod up -d --build
# Publishes 80 and 443 instead of 8080. Port 80 only redirects to HTTPS.

services:
  # Not left to the env file: a typo there must not silently weaken the deployed site.
  auth:
    environment:
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${DOMAIN}
  app:
    environment:
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${DOMAIN}

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
