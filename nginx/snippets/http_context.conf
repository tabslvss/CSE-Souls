# Docker's internal DNS. Resolving at request time means a restarted container
# with a new IP is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrades need these forwarded explicitly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limits are generous on purpose: during the presentation the whole audience
# may share one campus IP address. They stop floods, not a full lecture hall.
limit_req_zone  $binary_remote_addr zone=auth_requests:10m rate=20r/s;
# Password hashing is slow on purpose, so logins and signups are paced instead of all running at
# once. They wait their turn instead of being refused, which suits a room signing up together.
map $request_method $auth_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone  $auth_write_key zone=auth_writes:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=app_requests:10m  rate=200r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
limit_req_status  429;
limit_conn_status 429;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml model/gltf-binary;
