# Auth traffic goes to the auth server and is never seen by the app container.
# Matched case-insensitively, because the auth server's routes are too. /auth/xsrf issues the
# pre-login XSRF token, so it counts as auth traffic as well.
location ~* ^/(register|login|logout|auth/xsrf)/?$ {
    limit_req zone=auth_requests burst=200 nodelay;
    limit_req zone=auth_writes burst=200;
    set $auth_upstream http://auth:3001;
    proxy_pass $auth_upstream;
}

location = /ws {
    # Counts handshakes only, not messages on an open socket.
    limit_req zone=app_requests burst=1000 nodelay;
    set $app_upstream http://app:3000;
    proxy_pass $app_upstream;
    # Setting any proxy_set_header here discards the inherited ones, so all are repeated.
    # Without Host, the app's Origin check would refuse every handshake.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # The app pings every 25s, so an open socket never idles past this.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

# Files never go through the request limit. A whole room loading the game at once from one
# campus IP looks like a flood otherwise, and the game would fail to load for some of them.
location ~ ^/(assets|models|audio|icons|avatars)/ {
    limit_except GET {
        deny all;
    }
    set $app_upstream http://app:3000;
    proxy_pass $app_upstream;
}

location / {
    limit_req zone=app_requests burst=1000 nodelay;
    set $app_upstream http://app:3000;
    proxy_pass $app_upstream;
}
