server_tokens off;

# nginx and Express can read these paths differently (a backslash, an encoded slash, dot segments),
# which could route an auth path to the app or dodge a limit. No real page uses them.
if ($request_uri ~ "^[^?]*(\\\\|#|%2[fFeE]|%5[cC]|/\.\.?(/|$))") {
    return 400;
}

# Bounds on slow-send and slow-read attacks (DoS lecture).
client_header_timeout 10s;
client_body_timeout   15s;
send_timeout          20s;
keepalive_timeout     30s;

# Avatars are capped at 5 MB by the app. Anything larger stops here.
client_max_body_size 6m;
limit_conn connections 2000;

# Applies to every response, including ones nginx generates itself.
proxy_hide_header X-Content-Type-Options;
add_header X-Content-Type-Options "nosniff" always;

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
