name: cse-souls

# Local / grading stack: `docker compose up`, then open http://localhost:8080
# Only nginx publishes a port. The database is never reachable from outside Docker.

x-service-env: &service-env
  PGHOST: db
  PGDATABASE: ${DB_NAME}
  PGUSER: ${DB_USER}
  PGPASSWORD: ${DB_PASSWORD}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Exact origins allowed to make state-changing requests and open the WebSocket.
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Issues JWTs. It is the only service that can read the private signing key.
  auth:
    build:
      context: .
      target: auth
    restart: unless-stopped
    environment:
      <<: *service-env
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
    volumes:
      - jwt_private:/keys/private
      - jwt_public:/keys/public
    networks: [edge, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Serves the website, the REST API and the WebSocket. Holds the public key only.
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *service-env
    volumes:
      - jwt_public:/keys/public:ro
      - avatars:/data/avatars
    networks: [edge, data]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
      auth:
        condition: service_healthy

networks:
  edge:
  # No route to the outside world: only auth and app can reach the database.
  data:
    internal: true

volumes:
  db_data:
  jwt_private:
  jwt_public:
  avatars:
