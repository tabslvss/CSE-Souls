<!-- A development tool for trying every combat effect. Only the Vite dev server serves it:

  <head>
    <meta charset="utf-8" />
    <title>Effects lab</title>

      html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px sans-serif; overflow: hidden; }
