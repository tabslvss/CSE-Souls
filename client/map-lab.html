<!doctype html>
<!-- A development tool for walking the map with a free camera. Only the Vite dev server serves it:
     open http://localhost:5173/map-lab.html?view=spawn. It isn't part of the production build. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Map lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 12px monospace; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar { position: fixed; top: 6px; left: 6px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 90vw; }
      #bar button { background: #0009; color: #eee; border: 1px solid #555; font: inherit; cursor: pointer; }
      #stats { position: fixed; bottom: 6px; left: 6px; background: #0009; padding: 3px 6px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar"></div>
    <div id="stats"></div>
    <script type="module" src="/src/game/mapLab.ts"></script>
  </body>
</html>
